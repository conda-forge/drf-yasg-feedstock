schema_version: 1

context:
  version: "1.21.17"

package:
  name: drf-yasg
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/drf-yasg/drf_yasg-${{ version }}.tar.gz
  sha256: 05b4fcac07f4359aa0af51adee8ede2e74208a41d43ca0350a50a0bb9e2f3b76

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - setuptools-scm >=7.0,<8.dev0
    - pip
  run:
    - python >=${{ python_min }}
    - django >=4.0
    - djangorestframework >=3.13
    - inflection >=0.3.1
    - packaging >=21.0
    - pytz >=2021.1
    - pyyaml >=5.1
    - swagger-spec-validator >=2.1.0
    - uritemplate >=3.0.0

tests:
  - python:
      imports:
        - drf_yasg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Automated generation of real Swagger/OpenAPI 2.0 schemas from Django Rest Framework code.
  license: Apache-2.0 AND MIT AND BSD-3-Clause
  license_file:
    - LICENSE.rst
    - src/drf_yasg/static/drf-yasg/swagger-ui-dist/NOTICE
    - src/drf_yasg/static/drf-yasg/swagger-ui-dist/LICENSE
    - src/drf_yasg/static/drf-yasg/redoc-old/LICENSE
    - src/drf_yasg/static/drf-yasg/redoc/LICENSE
  homepage: https://github.com/axnsan12/drf-yasg
  documentation: https://drf-yasg.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - julian-belina
    - mgorny
